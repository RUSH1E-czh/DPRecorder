name: android

# 安卓包在 GitHub 的 runner 上编（手机上没有 NDK，跑不了交叉编译）。
# 推 DPR / DPS 相关路径会自动跑一次；也可以手动触发。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Rust 目标（aarch64 = 绝大多数真机）"
        required: false
        default: aarch64
  push:
    paths:
      - "DPR/src-tauri/**"
      - "DPS/dps/**"
      - "DPR/src/**"
      - "DPR/package.json"
      - "DPR/pnpm-lock.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  ANDROID_TARGET: aarch64

jobs:
  # 先只做类型检查：比完整打包快，出错也更快看到。
  # 编译错误会同时以 annotation 的形式挂到这次 run 上（方便在外面直接读）。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node 20 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable && corepack prepare pnpm@9 --activate

      # runner 镜像里自带 Android SDK 和若干 NDK，别再装一遍 setup-android（它会因为
      # 已经存在的 ANDROID_HOME 直接失败）。有现成的 NDK 就用最新的，没有才装。
      - name: NDK 与交叉编译工具链
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${NDK:-}" ] || [ ! -d "$NDK" ]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "ndk;27.0.12077973" > /dev/null
            NDK="$SDK/ndk/27.0.12077973"
          fi
          BIN=$(ls -d "$NDK"/toolchains/llvm/prebuilt/*/bin | head -1)
          CLANG=$(ls "$BIN"/aarch64-linux-android*-clang | head -1)
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$CLANG" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${CLANG}++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" >> "$GITHUB_ENV"
          echo "NDK=$NDK"
          echo "CLANG=$CLANG"

      - name: Rust + 安卓目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # DPS 依赖的 prpr-macroquad / prpr-miniquad / sasa 都在私有仓库里
      # （匿名访问 404），CI 必须带上只读令牌才拉得下来。令牌放在
      # Settings → Secrets and variables → Actions → GIT_DEPS_TOKEN。
      - name: 私有 git 依赖鉴权
        env:
          GIT_DEPS_TOKEN: ${{ secrets.GIT_DEPS_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          printf '\n[net]\ngit-fetch-with-cli = true\n' >> "$HOME/.cargo/config.toml"
          if [ -n "${GIT_DEPS_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${GIT_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "已配置私有依赖仓库的只读令牌"
          else
            echo "::warning title=缺少 GIT_DEPS_TOKEN::prpr-macroquad / prpr-miniquad / sasa 是私有仓库，没有令牌 cargo 拉不下来"
          fi

      - name: 预检 git 依赖
        run: |
          if ! cargo fetch --locked --target aarch64-linux-android; then
            echo "::error title=git 依赖拉取失败::DPS 依赖的 prpr-macroquad / prpr-miniquad / sasa 是私有仓库。请到 Settings → Secrets and variables → Actions 新建 GIT_DEPS_TOKEN（细粒度 PAT，对这三个仓库授予 Contents: Read）后重跑。"
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # tauri-cli 每次 cargo install 都要重编一遍（~10 分钟），单独缓存它的二进制。
      - name: 缓存 tauri-cli
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-${{ runner.os }}-v2
      - name: tauri-cli
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked
      - name: tauri-cli 版本
        run: cargo tauri --version

      # DPR/pnpm-workspace.yaml 只有 nodeLinker / confirmModulesPurge 这些配置、没有
      # `packages:` 字段（本地那套 pnpm 容忍，CI 的 pnpm 直接报
      # "packages field missing or empty"）。CI 里按「非 workspace 项目」安装即可。
      - name: 前端依赖与产物
        working-directory: DPR
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          # `pnpm run` 同样会去读 pnpm-workspace.yaml（照样报 packages 字段缺失），
          # 所以脚本用 npm 跑：node_modules 是 pnpm 装好的，npm 只负责跑 scripts。
          npm run build

      - name: 生成安卓工程
        working-directory: DPR
        run: cargo tauri android init --ci

      - name: cargo check（安卓目标）
        working-directory: DPR
        run: |
          set +e
          cargo check -p dpr --target aarch64-linux-android --message-format short 2>&1 | tee /tmp/check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 把前 12 条 rustc 错误挂成 annotation：run 页面上直接能读到，不用翻日志。
            grep -E "^error(\[|:)" /tmp/check.log | head -12 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | sed 's/^error/rustc error/' | cut -c1-400)
              echo "::error title=cargo check::${msg}"
            done
            echo "::error title=cargo check::失败，见上方 annotation 或原始日志"
          fi
          exit "$status"

  apk:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node 20 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable && corepack prepare pnpm@9 --activate

      - name: NDK 与交叉编译工具链
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${NDK:-}" ] || [ ! -d "$NDK" ]; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "ndk;27.0.12077973" > /dev/null
            NDK="$SDK/ndk/27.0.12077973"
          fi
          BIN=$(ls -d "$NDK"/toolchains/llvm/prebuilt/*/bin | head -1)
          CLANG=$(ls "$BIN"/aarch64-linux-android*-clang | head -1)
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$CLANG" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=${CLANG}++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" >> "$GITHUB_ENV"

      - name: Rust + 安卓目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # DPS 依赖的 prpr-macroquad / prpr-miniquad / sasa 都在私有仓库里
      # （匿名访问 404），CI 必须带上只读令牌才拉得下来。令牌放在
      # Settings → Secrets and variables → Actions → GIT_DEPS_TOKEN。
      - name: 私有 git 依赖鉴权
        env:
          GIT_DEPS_TOKEN: ${{ secrets.GIT_DEPS_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          printf '\n[net]\ngit-fetch-with-cli = true\n' >> "$HOME/.cargo/config.toml"
          if [ -n "${GIT_DEPS_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${GIT_DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "已配置私有依赖仓库的只读令牌"
          else
            echo "::warning title=缺少 GIT_DEPS_TOKEN::prpr-macroquad / prpr-miniquad / sasa 是私有仓库，没有令牌 cargo 拉不下来"
          fi

      - name: 预检 git 依赖
        run: |
          if ! cargo fetch --locked --target aarch64-linux-android; then
            echo "::error title=git 依赖拉取失败::DPS 依赖的 prpr-macroquad / prpr-miniquad / sasa 是私有仓库。请到 Settings → Secrets and variables → Actions 新建 GIT_DEPS_TOKEN（细粒度 PAT，对这三个仓库授予 Contents: Read）后重跑。"
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 缓存 tauri-cli
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-${{ runner.os }}-v2
      - name: tauri-cli
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # DPR/pnpm-workspace.yaml 只有 nodeLinker / confirmModulesPurge 这些配置、没有
      # `packages:` 字段（本地那套 pnpm 容忍，CI 的 pnpm 直接报
      # "packages field missing or empty"）。CI 里按「非 workspace 项目」安装即可。
      - name: 前端依赖与产物
        working-directory: DPR
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          # `pnpm run` 同样会去读 pnpm-workspace.yaml（照样报 packages 字段缺失），
          # 所以脚本用 npm 跑：node_modules 是 pnpm 装好的，npm 只负责跑 scripts。
          npm run build

      - name: 生成安卓工程
        working-directory: DPR
        run: cargo tauri android init --ci

      - name: 打包 APK
        working-directory: DPR
        run: |
          set +e
          cargo tauri android build \
            --target "${{ github.event.inputs.target || env.ANDROID_TARGET }}" \
            --apk 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^error(\[|:)" /tmp/build.log | head -12 | while IFS= read -r line; do
              echo "::error title=apk::$(printf '%s' "$line" | cut -c1-400)"
            done
          fi
          exit "$status"

      - name: 收集 APK
        if: always()
        run: |
          mkdir -p out
          find DPR/gen/android -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          find target -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          ls -l out || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dpr-android-apk
          path: out/*.apk
          if-no-files-found: warn
