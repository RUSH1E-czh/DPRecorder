name: android

# 安卓包只在这里（或本地 PC）验证：手机上没有 NDK，跑不了交叉编译。
# 手动触发，避免每次 push 都跑一遍十分钟的构建。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Rust 目标三元组（aarch64 = 绝大多数真机）"
        required: false
        default: aarch64

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Node 20 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable && corepack prepare pnpm@9 --activate

      - name: 安装 Android SDK / NDK
        uses: android-actions/setup-android@v3
      - name: 安装 NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.1.10909125" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: 安装 Rust 与安卓目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 前端依赖与产物
        run: |
          pnpm --dir DPR install --frozen-lockfile
          pnpm --dir DPR build

      - name: 生成安卓工程并打包
        working-directory: DPR
        run: |
          cargo tauri android init --ci
          cargo tauri android build --target "${{ github.event.inputs.target || 'aarch64' }}" --apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: dpr-android-apk
          path: |
            target/**/release/apk/*.apk
            DPR/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
